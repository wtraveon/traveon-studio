name: Validate static website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required site files
        run: |
          set -eu
          test -f index.html
          test -f 404.html
          test -f assets/traveon-studio.css
          test -f robots.txt
          test -f sitemap.xml
          test -f _headers
          test -f scripts/validate_site.py
          echo "Required static website files are present."
      - name: Run structural and local-reference validation
        run: python3 scripts/validate_site.py
      - name: Check Python validator and Pages Function syntax
        run: |
          python3 -m py_compile scripts/validate_site.py
          node --input-type=module --check < functions/api/consultation.js
      - name: Check HTML files are non-empty
        run: |
          set -eu
          find . -type f -name '*.html' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            test -s "$file" || { echo "Empty HTML file: $file"; exit 1; }
          done
          echo "HTML files are non-empty."
