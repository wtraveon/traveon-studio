<section class="hero" id="home"><div class="wrap"><div class="hero-layout"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-line"></span> Small-business web design · Wilson, NC + remote</div><h1>Make your first impression count. <em>Make it work harder.</em></h1><p class="lead">Thoughtful, mobile-first websites for small businesses ready to look established, earn trust, and turn more visits into real inquiries.</p><div class="actions"><a class="btn" href="#contact">Start your website <span aria-hidden="true">↗</span></a><a class="btn light" href="#work">Explore the work <span aria-hidden="true">↗</span></a></div><div class="proofline"><span class="dot"></span> Clear strategy · Clean design · Practical functionality</div></div><div class="hero-visual" aria-label="Illustration of a polished website on desktop and mobile screens"><div class="visual-orbit orbit-one"></div><div class="visual-orbit orbit-two"></div><div class="browser-card"><div class="browser-top"><div class="browser-dots"><i></i><i></i><i></i></div><span>YOUR BUSINESS, BETTER</span><span class="browser-menu">•••</span></div><div class="browser-content"><div class="mock-nav"><span class="mock-logo">YOUR BRAND<span>.</span></span><span class="mock-nav-links">ABOUT&nbsp;&nbsp; SERVICES&nbsp;&nbsp; CONTACT</span></div><div class="mock-hero"><div class="mock-kicker">MADE FOR WHAT’S NEXT</div><div class="mock-headline">A clearer path<br/>to your next<br/><em>customer.</em></div><div class="mock-line"></div><div class="mock-cta">LET’S TALK&nbsp; ↗</div></div><div class="mock-bottom"><span>01&nbsp; / &nbsp;STRATEGY</span><span>02&nbsp; / &nbsp;DESIGN</span><span>03&nbsp; / &nbsp;GROWTH</span></div></div></div><div class="floating-note"><span class="note-check">✓</span><span><strong>Designed with purpose</strong><small>Responsive. Clear. Ready to grow.</small></span></div><div class="visual-badge"><span>TS</span><small>TRAVEON<br/>STUDIO</small></div><div class="floating-toast toast-one"><span class="toast-icon">✓</span><span><strong>Mobile-ready</strong><small>Built for every screen</small></span></div><div class="floating-toast toast-two"><span class="toast-icon toast-arrow">↗</span><span><strong>Made to stand out</strong><small>A sharper first impression</small></span></div></div></div><div class="stats"><div class="stat"><strong>$600</strong><span>Website Starter · up to five pages</span></div><div class="stat"><strong>2–4 weeks</strong><span>Typical timeline after content is ready</span></div><div class="stat"><strong>30 days</strong><span>Post-launch support</span></div></div></div></section>
<section class="services-section"><div class="wrap"><div class="section-head"><div class="eyebrow">A better online first impression</div><h2>A website should make your business easier to trust—and easier to choose.</h2><p>Social media can introduce your business. Your website gives customers one reliable place to understand what you do and what to do next.</p></div><div class="grid"><article class="card"><div class="num">01 / CREDIBILITY</div><h3>Look established from the first click.</h3><p>Clear structure, polished presentation, and a professional domain create a stronger first impression.</p></article><article class="card"><div class="num">02 / RESPONSIVE</div><h3>Work cleanly on every screen.</h3><p>Designed around phones first, then carefully scaled for tablets, laptops, and desktops.</p></article><article class="card"><div class="num">03 / ACTION</div><h3>Make the next customer move obvious.</h3><p>Calls, booking, shopping, forms, directions, and inquiries are placed where customers can use them.</p></article></div></div></section>
